spring:
  application:
    name: zero-code-app-sandbox
  profiles:
    active: local
  session:
    store-type: redis
    timeout: 2592000
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.peng.zerocodeappsandbox.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

